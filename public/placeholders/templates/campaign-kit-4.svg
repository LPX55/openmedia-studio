<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Brief fanning out to three campaign formats">
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- Brief card on left -->
  <rect x="18" y="52" width="34" height="56" rx="4" fill="#141820" stroke="#3A4356" stroke-width="1.4"/>
  <line x1="25" y1="64" x2="45" y2="64" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="74" x2="43" y2="74" stroke="#3A4356" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="82" x2="45" y2="82" stroke="#3A4356" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="25" y1="90" x2="39" y2="90" stroke="#3A4356" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Branching bezier wires -->
  <path d="M52 68 C70 68 68 48 86 48" fill="none" stroke="#3A4356" stroke-width="1.3"/>
  <path d="M52 80 C70 80 68 98 86 98" fill="none" stroke="#3A4356" stroke-width="1.3"/>
  <path d="M52 92 C78 92 88 80 112 80" fill="none" stroke="#FBBF24" stroke-width="1.6"/>
  <!-- Three kit formats: 16:9 + 1:1 outlined, 9:16 filled with motion play icon -->
  <rect x="86" y="36" width="38" height="22" rx="3" fill="#141820" stroke="#3A4356" stroke-width="1.3"/>
  <rect x="86" y="84" width="28" height="28" rx="3" fill="#141820" stroke="#3A4356" stroke-width="1.3"/>
  <rect x="112" y="48" width="30" height="64" rx="3.5" fill="#FBBF24" fill-opacity="0.22" stroke="#FBBF24" stroke-width="1.6"/>
  <polygon points="124,74 124,86 133,80" fill="#FBBF24"/>
</svg>
