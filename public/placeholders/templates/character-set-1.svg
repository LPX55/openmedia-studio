<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Portrait silhouette repeated in three crops and treatments">
  <defs>
    <!-- Canonical character bust silhouette (head + asymmetric hair + shoulders) -->
    <g id="subj">
      <path d="M-11 -16 C-12 -27 1 -31 9 -24 C14 -20 15 -11 11 -3 C8 2 4 4 0 4 C-6 4 -10 -2 -11 -10 Z"/>
      <path d="M-22 28 C-22 14 -12 8 0 8 C12 8 22 14 22 28 Z"/>
    </g>
    <clipPath id="c1"><rect x="16" y="40" width="38" height="76" rx="4"/></clipPath>
    <clipPath id="c2"><rect x="61" y="48" width="38" height="60" rx="4"/></clipPath>
    <clipPath id="c3"><rect x="106" y="34" width="38" height="88" rx="4"/></clipPath>
  </defs>
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- Crop 1: Medium studio treatment (muted slate) -->
  <rect x="16" y="40" width="38" height="76" rx="4" fill="#141820" stroke="#3A4356" stroke-width="1.3"/>
  <g clip-path="url(#c1)" transform="translate(35 88) scale(0.95)" fill="#1B212C" stroke="#3A4356" stroke-width="1.4">
    <use href="#subj"/>
  </g>
  <!-- Crop 2: Tight close-up treatment (accent-tinted fill) -->
  <rect x="61" y="48" width="38" height="60" rx="4" fill="#1B212C" stroke="#818cf8" stroke-width="1.5"/>
  <g clip-path="url(#c2)" transform="translate(80 95) scale(1.45)" fill="#818cf8" fill-opacity="0.32" stroke="#818cf8" stroke-width="1.1">
    <use href="#subj"/>
  </g>
  <!-- Crop 3: 9:16 full street crop (solid accent silhouette) -->
  <rect x="106" y="34" width="38" height="88" rx="4" fill="#141820" stroke="#3A4356" stroke-width="1.3"/>
  <g clip-path="url(#c3)" transform="translate(125 94) scale(0.78)" fill="#818cf8" fill-opacity="0.88">
    <use href="#subj"/>
  </g>
</svg>
