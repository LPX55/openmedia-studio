<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Close-up 1:1 portrait crop">
  <defs>
    <clipPath id="closeup-clip">
      <rect x="36" y="36" width="88" height="88" rx="6"/>
    </clipPath>
  </defs>
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- 1:1 close-up square frame -->
  <rect x="36" y="36" width="88" height="88" rx="6" fill="#141820" stroke="#818cf8" stroke-width="1.6"/>
  <g clip-path="url(#closeup-clip)">
    <!-- Window light split on left half -->
    <rect x="36" y="36" width="44" height="88" fill="#818cf8" fill-opacity="0.10"/>
    <!-- Tight collarbone crop of the same subject (scaled 1.45x) -->
    <path d="M40 144 C40 112 57 98 80 98 C103 98 120 112 120 144 Z" fill="#1B212C" stroke="#3A4356" stroke-width="1.6"/>
    <path d="M59 62 C57 40 81 33 96 45 C106 53 108 71 100 85 C94 94 87 98 80 98 C68 98 60 87 59 73 Z" fill="#818cf8" fill-opacity="0.28" stroke="#818cf8" stroke-width="1.8"/>
  </g>
  <!-- Corner crop ticks -->
  <path d="M30 44V30H44 M116 30H130V44 M30 116V130H44 M116 130H130V116" fill="none" stroke="#3A4356" stroke-width="1.3" stroke-linecap="round"/>
</svg>
