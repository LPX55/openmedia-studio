<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Restyled output video clip">
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- Restyled film frame -->
  <rect x="22" y="36" width="116" height="88" rx="5" fill="#1B212C" stroke="#a78bfa" stroke-width="1.6"/>
  <!-- Two cel bands inside restyled output -->
  <polygon points="23,37 137,37 137,76 23,92" fill="#a78bfa" fill-opacity="0.22"/>
  <!-- Sprocket tracks -->
  <g fill="#0C0F16" stroke="#3A4356" stroke-width="1">
    <rect x="27" y="44" width="6" height="10" rx="1"/><rect x="27" y="62" width="6" height="10" rx="1"/>
    <rect x="27" y="88" width="6" height="10" rx="1"/><rect x="27" y="106" width="6" height="10" rx="1"/>
    <rect x="127" y="44" width="6" height="10" rx="1"/><rect x="127" y="62" width="6" height="10" rx="1"/>
    <rect x="127" y="88" width="6" height="10" rx="1"/><rect x="127" y="106" width="6" height="10" rx="1"/>
  </g>
  <!-- Cel-shaded subject blocking + motion lines in accent -->
  <line x1="42" y1="68" x2="60" y2="68" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38" y1="82" x2="56" y2="82" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="84" cy="66" r="13" fill="#a78bfa"/>
  <path d="M62 114 C62 92 72 84 84 84 C96 84 106 92 106 114 Z" fill="#a78bfa" fill-opacity="0.88"/>
</svg>
