  <path d="M56 76 A26 24 0 0 1 102 54" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M62 114 A28 20 0 0 0 98 104" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>
