<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Product on plinth under single key light">
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- Single upper-left key light cone -->
  <polygon points="0,0 74,0 132,126 28,126" fill="#2DD4BF" fill-opacity="0.09"/>
  <!-- Matte plinth (top + front face) -->
  <polygon points="34,104 126,104 138,114 22,114" fill="#1B212C" stroke="#3A4356" stroke-width="1.2"/>
  <rect x="22" y="114" width="116" height="14" fill="#141820" stroke="#2A3140" stroke-width="1.2"/>
  <!-- Contact shadow on plinth -->
  <ellipse cx="85" cy="109" rx="22" ry="3.5" fill="#0C0F16" fill-opacity="0.85"/>
  <!-- Product silhouette (flacon/bottle) -->
  <rect x="64" y="54" width="32" height="54" rx="5" fill="#141820" stroke="#3A4356" stroke-width="1.5"/>
  <rect x="72" y="42" width="16" height="12" rx="2" fill="#1B212C" stroke="#3A4356" stroke-width="1.4"/>
  <!-- Key-lit left edge & front label accent -->
  <path d="M65 106V59a4 4 0 0 1 4-4h10" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <rect x="69" y="69" width="22" height="18" rx="2" fill="#2DD4BF" fill-opacity="0.85"/>
</svg>
