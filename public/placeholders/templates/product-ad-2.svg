<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Product silhouette framed 9:16">
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- Outer subtle guide rails -->
  <line x1="36" y1="32" x2="36" y2="128" stroke="#2A3140" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="124" y1="32" x2="124" y2="128" stroke="#2A3140" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- 9:16 vertical crop frame -->
  <rect x="52" y="30" width="56" height="100" rx="5" fill="#141820" stroke="#2DD4BF" stroke-width="1.5"/>
  <!-- Single key light inside 9:16 frame -->
  <polygon points="53,31 92,31 107,104 53,104" fill="#2DD4BF" fill-opacity="0.08"/>
  <!-- Plinth inside vertical crop -->
  <polygon points="58,92 102,92 107,98 53,98" fill="#1B212C" stroke="#3A4356" stroke-width="1"/>
  <rect x="53" y="98" width="54" height="10" fill="#0C0F16" stroke="#2A3140" stroke-width="1"/>
  <!-- Same product silhouette in upper two-thirds -->
  <rect x="70" y="54" width="20" height="40" rx="3.5" fill="#1B212C" stroke="#3A4356" stroke-width="1.3"/>
  <rect x="75" y="45" width="10" height="9" rx="1.5" fill="#1B212C" stroke="#3A4356" stroke-width="1.2"/>
  <rect x="73" y="65" width="14" height="12" rx="1.5" fill="#2DD4BF" fill-opacity="0.88"/>
  <!-- Caption space rule at bottom of 9:16 frame -->
  <line x1="64" y1="118" x2="96" y2="118" stroke="#3A4356" stroke-width="1.5" stroke-linecap="round"/>
</svg>
