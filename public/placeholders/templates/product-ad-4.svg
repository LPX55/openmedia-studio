<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Product vertical tilt motion 9:16">
  <rect width="160" height="160" fill="#0C0F16"/>
  <!-- 9:16 vertical video frame -->
  <rect x="48" y="30" width="64" height="100" rx="6" fill="#141820" stroke="#3A4356" stroke-width="1.4"/>
  <!-- Plinth & product silhouette -->
  <polygon points="56,104 104,104 108,110 52,110" fill="#1B212C" stroke="#2A3140" stroke-width="1"/>
  <rect x="69" y="58" width="22" height="46" rx="4" fill="#1B212C" stroke="#3A4356" stroke-width="1.3"/>
  <rect x="75" y="48" width="10" height="10" rx="1.5" fill="#1B212C" stroke="#3A4356" stroke-width="1.2"/>
  <rect x="73" y="70" width="14" height="13" rx="1.5" fill="#2DD4BF" fill-opacity="0.35"/>
  <!-- Vertical camera tilt-up vector along right side -->
  <line x1="124" y1="108" x2="124" y2="48" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <polyline points="119,54 124,46 129,54" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="120" y1="108" x2="128" y2="108" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round"/>
</svg>
